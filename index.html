<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>栄養計算アプリ</title>
</head>
<body>
    <div>
        <label for="proteinInput">タンパク質の量(g): </label>
        <input type="number" id="proteinInput">
        <br>
        <label for="fatInput">脂質の量(g): </label>
        <input type="number" id="fatInput">
        <br>
        <label for="carbInput">糖質の量(g): </label>
        <input type="number" id="carbInput">
    </div>
    <br>
    <button id="calcButton">計算する</button>
    <hr>
    <h2>計算結果</h2>
    <p>入力したタンパク質: <span id="proteinResult"></span>g</p>
    <p>入力した脂質: <span id="fatResult"></span>g</p>
    <p>入力した糖質: <span id=""
    <p>カロリー: <span id="caloriesResult"></span>kcal</p>
    
    
<script src="app.js"></script>
</body>
</html>
