<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>栄養計算アプリ</title>
</head>
<body>
    <div>
        <h2>カロリーを計算</h2>
        <label for="proteinInput">タンパク質の量(g): </label>
        <input type="number" id="proteinInput">
        <br>
        <label for="fatInput">脂質の量(g): </label>
        <input type="number" id="fatInput">
        <br>
        <label for="carbInput">糖質の量(g): </label>
        <input type="number" id="carbInput">
        <br>
        <p><span id="liveCalories"></span>kcal</p>
        <button id="liveCaloriesButton">現在のカロリーを表示</button>
    </div>
    <button id="calcButton">計算する</button>
    <hr>
    <h2>計算結果</h2>
    <p>タンパク質: <span id="proteinResult"></span>g</p>
    <p>脂質: <span id="fatResult"></span>g</p>
    <p>糖質: <span id="carbResult"></span>g</p>
    <p>カロリー: <span id="caloriesResult"></span>kcal</p>
    
    
<script src="app.js"></script>
</body>
</html>
