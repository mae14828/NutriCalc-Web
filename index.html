<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>栄養計算アプリ</title>
</head>
<body>
    <label for="proteinInput">タンパク質の量(g): </label>
    <input type="number" id="proteinInput">
    <br>
    <button id="calcButton">計算する</button>
    <hr>
    <h2>計算結果</h2>
    <p>入力したタンパク質: <span id="proteinResult"></span>g</p>
    <p>カロリー: <span id="caloriesResult"></span>kcal</p>
    
<script src="app.js"></script>
</body>
</html>
